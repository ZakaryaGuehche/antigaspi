<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AntiGaspi</title>
<style>
:root { --vert: #2e7d32; --fond: #f4f7f2; --gris: #6b7280; }
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, sans-serif; background: var(--fond); color: #1f2937; }
header { background: var(--vert); color: #fff; padding: 1.2rem 1rem; text-align: center; }
header h1 { margin: 0; font-size: 1.6rem; }
header p { margin: .3rem 0 0; opacity: .9; }
main { max-width: 900px; margin: 0 auto; padding: 1rem; }
form { background: #fff; border-radius: 10px; padding: 1rem; display: grid; gap: .6rem; grid-template-columns: repeat(2, 1fr); box-shadow: 0 1px 4px rgba(0,0,0,.1); }
form h2 { grid-column: 1 / -1; margin: 0; font-size: 1.1rem; }
input { padding: .5rem; border: 1px solid #d1d5db; border-radius: 6px; font-size: 1rem; width: 100%; }
.large { grid-column: 1 / -1; }
button { padding: .55rem 1rem; border: 0; border-radius: 6px; background: var(--vert); color: #fff; font-size: 1rem; cursor: pointer; }
button:disabled { background: #9ca3af; cursor: not-allowed; }
button.suppr { background: transparent; color: #b91c1c; padding: .55rem .5rem; }
#message { min-height: 1.4rem; margin: .8rem 0; color: #b91c1c; }
#liste { display: grid; gap: .8rem; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.carte { background: #fff; border-radius: 10px; padding: 1rem; box-shadow: 0 1px 4px rgba(0,0,0,.1); display: flex; flex-direction: column; gap: .4rem; }
.carte h3 { margin: 0; }
.commerce { color: var(--gris); font-size: .9rem; }
.prix { font-size: 1.2rem; font-weight: 700; color: var(--vert); }
.prix s { color: var(--gris); font-weight: 400; font-size: .95rem; margin-left: .4rem; }
.actions { display: flex; justify-content: space-between; align-items: center; margin-top: auto; }
.reste { color: var(--gris); font-size: .9rem; }
@media (max-width: 560px) { form { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<header>
  <h1>AntiGaspi</h1>
  <p>Des paniers d'invendus à petit prix près de chez vous</p>
</header>
<main>
  <form id="formulaire">
    <h2>Publier un panier</h2>
    <input name="commerce" placeholder="Commerce" required>
    <input name="titre" placeholder="Titre du panier" required>
    <input class="large" name="description" placeholder="Description">
    <input name="prix_initial" type="number" step="0.01" min="0.01" placeholder="Prix initial (€)" required>
    <input name="prix_reduit" type="number" step="0.01" min="0.01" placeholder="Prix réduit (€)" required>
    <input name="quantite" type="number" min="1" value="1" placeholder="Quantité" required>
    <button type="submit">Publier</button>
  </form>
  <div id="message"></div>
  <section id="liste"></section>
</main>
<script>
const liste = document.getElementById("liste");
const message = document.getElementById("message");
const formulaire = document.getElementById("formulaire");

function afficherErreur(texte) {
  message.textContent = texte;
}

async function appeler(url, options) {
  const reponse = await fetch(url, options);
  if (!reponse.ok) {
    let detail = "Erreur " + reponse.status;
    try {
      const corps = await reponse.json();
      if (typeof corps.detail === "string") detail = corps.detail;
    } catch (e) {}
    throw new Error(detail);
  }
  return reponse.status === 204 ? null : reponse.json();
}

function creerCarte(panier) {
  const carte = document.createElement("article");
  carte.className = "carte";

  const titre = document.createElement("h3");
  titre.textContent = panier.titre;

  const commerce = document.createElement("div");
  commerce.className = "commerce";
  commerce.textContent = panier.commerce;

  const description = document.createElement("div");
  description.textContent = panier.description;

  const prix = document.createElement("div");
  prix.className = "prix";
  prix.textContent = panier.prix_reduit.toFixed(2) + " €";
  const ancien = document.createElement("s");
  ancien.textContent = panier.prix_initial.toFixed(2) + " €";
  prix.appendChild(ancien);

  const actions = document.createElement("div");
  actions.className = "actions";

  const reste = document.createElement("span");
  reste.className = "reste";
  reste.textContent = panier.quantite + " disponible(s)";

  const reserver = document.createElement("button");
  reserver.textContent = panier.quantite > 0 ? "Réserver" : "Épuisé";
  reserver.disabled = panier.quantite <= 0;
  reserver.addEventListener("click", () => reserverPanier(panier.id));

  const supprimer = document.createElement("button");
  supprimer.className = "suppr";
  supprimer.textContent = "Supprimer";
  supprimer.addEventListener("click", () => supprimerPanier(panier.id));

  actions.append(reste, reserver, supprimer);
  carte.append(titre, commerce, description, prix, actions);
  return carte;
}

async function charger() {
  try {
    const paniers = await appeler("/api/paniers");
    liste.replaceChildren(...paniers.map(creerCarte));
    afficherErreur(paniers.length === 0 ? "Aucun panier pour le moment." : "");
  } catch (e) {
    afficherErreur(e.message);
  }
}

async function reserverPanier(id) {
  try {
    await appeler("/api/paniers/" + id + "/reserver", { method: "POST" });
    await charger();
  } catch (e) {
    afficherErreur(e.message);
  }
}

async function supprimerPanier(id) {
  try {
    await appeler("/api/paniers/" + id, { method: "DELETE" });
    await charger();
  } catch (e) {
    afficherErreur(e.message);
  }
}

formulaire.addEventListener("submit", async (evenement) => {
  evenement.preventDefault();
  const donnees = new FormData(formulaire);
  const panier = {
    commerce: donnees.get("commerce"),
    titre: donnees.get("titre"),
    description: donnees.get("description"),
    prix_initial: parseFloat(donnees.get("prix_initial")),
    prix_reduit: parseFloat(donnees.get("prix_reduit")),
    quantite: parseInt(donnees.get("quantite"), 10)
  };
  try {
    await appeler("/api/paniers", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(panier)
    });
    formulaire.reset();
    await charger();
  } catch (e) {
    afficherErreur(e.message);
  }
});

charger();
</script>
</body>
</html>
