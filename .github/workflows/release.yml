name: Release

on:
  push:
    tags: ["v*"]

env:
  REGISTRY: ghcr.io

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      owner: ${{ steps.vars.outputs.owner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Vérifier que le tag est sur main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: vars
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/antigaspi-api:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/antigaspi-api:latest
      - name: Image front
        uses: docker/build-push-action@v6
        with:
          context: ./front
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/antigaspi-front:${{ github.ref_name }}
            ${{ env.REGISTRY }}/${{ steps.vars.outputs.owner }}/antigaspi-front:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: helm/kind-action@v1
        with:
          cluster_name: antigaspi
      - name: Charger les images dans le cluster
        run: |
          OWNER=${{ needs.build-push.outputs.owner }}
          TAG=${{ github.ref_name }}
          for service in api front; do
            docker pull ${{ env.REGISTRY }}/$OWNER/antigaspi-$service:$TAG
            docker tag ${{ env.REGISTRY }}/$OWNER/antigaspi-$service:$TAG antigaspi-$service:local
            kind load docker-image antigaspi-$service:local --name antigaspi
          done
      - name: Déployer sur Kubernetes
        run: |
          kubectl apply -f deploy/00-namespace.yaml -f deploy/10-configmap.yaml
          kubectl create secret generic antigaspi-secret --namespace antigaspi --from-literal=DB_PASSWORD="${{ secrets.DB_PASSWORD }}"
          kubectl apply -f deploy/20-postgres.yaml -f deploy/30-api.yaml -f deploy/40-front.yaml
      - name: Attendre les déploiements
        run: |
          kubectl rollout status deployment/postgres --namespace antigaspi --timeout=180s
          kubectl rollout status deployment/api --namespace antigaspi --timeout=180s
          kubectl rollout status deployment/front --namespace antigaspi --timeout=180s
      - name: Test de fumée
        run: |
          kubectl port-forward --namespace antigaspi service/front 8080:8080 &
          sleep 5
          curl -fs http://localhost:8080/api/health
      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl get pods --namespace antigaspi
          kubectl describe pods --namespace antigaspi
          kubectl logs --namespace antigaspi --selector app=api --tail=50