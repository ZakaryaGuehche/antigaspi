name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop, main]

jobs:
  tests-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -v

  build-compose:
    runs-on: ubuntu-latest
    needs: tests-api
    steps:
      - uses: actions/checkout@v4
      - name: Préparer le fichier .env
        run: cp .env.example .env
      - name: Construire et lancer la stack
        run: docker compose up -d --build
      - name: Attendre l'API et le front
        run: |
          for i in $(seq 1 30); do
            if curl -fs http://localhost:8080/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Arrêter la stack
        if: always()
        run: docker compose down -v